<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Default meta for the homepage (and fallback for crawlers that don't run JS).
      Per-page <title>, <meta name="description">, and <link rel="canonical"> are
      injected at runtime by react-helmet-async via the PageMeta component in
      SEOPageLayout.tsx. They override these defaults for every SEO page.
    -->
    <title>Spendable — Know exactly how much you can safely spend</title>
    <meta
      name="description"
      content="Financial clarity for freelancers. Income smoothing, tax reserves, and runway prediction so you always know how much you can safely spend."
    />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Default Open Graph (overridden per-page by Helmet) -->
    <meta
      property="og:title"
      content="Spendable — Financial clarity for freelancers"
    />
    <meta
      property="og:description"
      content="Stop guessing. Know exactly how much you can safely spend, even with irregular income."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spendable.finance/" />
    <meta
      property="og:image"
      content="https://spendable.finance/og-image.png"
    />
    <meta property="og:site_name" content="Spendable" />

    <!-- Default Twitter (overridden per-page by Helmet) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@spendable_" />
    <meta
      name="twitter:title"
      content="Spendable — Financial clarity for freelancers"
    />
    <meta
      name="twitter:description"
      content="Stop guessing. Know exactly how much you can safely spend."
    />
    <meta
      name="twitter:image"
      content="https://spendable.finance/og-image.png"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts — Fraunces (headings) + DM Sans (body) used across all pages -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
